0%, 100% { transform: translate(0, 0); }
25% { transform: translate(-2px, 2px); }

  <script>
    // ==================== CANVAS STAR ====================
    let starBg = document.getElementById("starCanvas");
    let starPn = starBg.getContext("2d");
    starBg.width = window.innerWidth;
    starBg.height = window.innerHeight;
    
    let atoms = [];
    
    class creatAtom {
      constructor() {
        this.x = Math.random() * starBg.width;
        this.y = Math.random() * starBg.height;
        this.moveX = (Math.random() - 0.5) * 0.5;
        this.moveY = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2.5;
        this.opacity = Math.random() + 0.05;
      }
      
      update() {
        this.x += this.moveX;
        this.y += this.moveY;
        if (this.x > starBg.width || this.x < 0) {
          this.moveX *= -1;
        }
        if (this.y > starBg.height || this.y < 0) {
          this.moveY *= -1;
        }
      }
      
      draw() {
        starPn.beginPath();
        starPn.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        starPn.fillStyle = `rgba(100,180,180,${this.opacity})`;
        starPn.fill();
      }
    }
    
    for (let i = 0; i < 200; i++) {
      atoms.push(new creatAtom());
    }
    
    function updateStars() {
      starPn.clearRect(0, 0, starBg.width, starBg.height);
      
      atoms.forEach(A => {
        A.update();
        A.draw();
      });
      
      requestAnimationFrame(updateStars);
    }
    
    updateStars();
    
    // ==================== CANVAS LINES ====================
    let lineBg = document.getElementById("lineCanvas");
    let linePn = lineBg.getContext("2d");
    lineBg.width = window.innerWidth;
    lineBg.height = window.innerHeight;
    linePn.shadowColor = "#33f0ff";
    linePn.shadowBlur = 5;
    let castles = document.querySelectorAll(".castle223");
    function drawLines() {
      let positions = [];
      
      castles.forEach(img => {
        positions.push(img.getBoundingClientRect());
      });
      
      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          let a = positions[i];
          let b = positions[j];
          
          linePn.beginPath();
          linePn.moveTo(a.x + a.width / 2, a.y + a.height / 2);
          linePn.lineTo(b.x + b.width / 2, b.y + b.height / 2);
          linePn.strokeStyle = "#555";
          linePn.lineWidth = 0.7;
          linePn.stroke();
        }
      }
    }
    
    drawLines();
    
    window.addEventListener("resize", () => {
      starBg.width = window.innerWidth;
      starBg.height = window.innerHeight;
      lineBg.width = window.innerWidth;
      lineBg.height = window.innerHeight;
      atoms = [];
for (let i = 0; i < 200; i++) {
  let atom = new creatAtom();
  atom.size *= 2;
  atoms.push(atom);
    }
      drawLines();
    });

  /*=================== EVENT BTN INFO ===================*/

    function enemie_information() {
    const enemyFields = {
      power: 'enemie-power',
      level: 'enemie-level',
      name: 'enemie-name',
      gold: 'enemie-gold',
      wood: 'enemie-wood',
      weath: 'enemie-weath',
      cavalry: 'enemie-cavalry',
      chariot: 'enemie-chariot',
      archer: 'enemie-archer',
      infantry: 'enemie-infantry'
    };
    for([key,id] of Object.entries(enemyFields)){
      document.getElementById(id).textContent = objectEnemieInfo[key];
    }
    const forcesEnemie =
      Number(objectEnemieInfo.cavalry) +
      Number(objectEnemieInfo.chariot) +
      Number(objectEnemieInfo.archer) +
      Number(objectEnemieInfo.infantry);

      document.getElementById('enemie-forces').textContent = forcesEnemie;
      document.getElementById('forces-enemie').textContent = forcesEnemie;
          }

    document.querySelectorAll('.btn-close').forEach(page=>{
      page.addEventListener('click',()=>{
      sectionInfoEnemie.style.display = 'none';
      mapEnemie.style.display = 'none';
      });
    });
      
/*==================== ALL FORCES ME/ENEMIE  ====================*/
    let forcesMe = parseInt(localStorage.getItem('totalForces'));

  </script>
