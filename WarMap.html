<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Faster+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Shadow&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Risque&display=swap" rel="stylesheet">
  <title>WarMap</title>
  <style>
    /* ==================== CSS ==================== */
    body {
      min-height: 100dvh;
      background: #000;
      display: grid;
      border: 1px solid #666;
      justify-content: center;
      margin: 0;
      font-family: "Uncial Antiqua", cursive;
    }
    @keyframes changeColor {
      0%,100% {box-shadow: 0 0 13px #fb0;}
      50% {box-shadow: 0 0 10px #0ff;}
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-2px, -2px); }
    }
    #fatherMap {
      margin-left: 0;
      margin-top: 25vh;
      width: 90vw;
      border: none;
      transition: all 1s ease;
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      position: relative;
      z-index: 10;
    }
    #fatherMap div{
      position: relative;
      height:100%;
      width:100%;
    }
    #fatherMap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      border-radius: 500px;
      z-index: 10;
      border: none;
      border-top: clamp(2px,0.7vw,80px) solid #fa0;
      border-bottom: clamp(2px,0.7vw,80px) solid #80f;
      box-shadow: 
        1px 1px clamp(2px,1vw,80px) #80f,
        -1px -1px clamp(4px,1.5vw,80px) #fa0,
        0 0 clamp(6px,2vw,80px) #80f,
        0 0 clamp(8px,2.5vw,80px) #fa0
      ;
      animation: changeColr 2s infinite,shake 2s infinite;
    }
    #fatherMap img:hover {
      
      box-shadow: 
        0 0 4px #80f,
        0 0 6px #fa0,
        0 0 8px #80f,
        0 0 10px #fa0
      ;
    }
    #fatherMap h1{
      position: absolute;
      color: red;
      width: 30%;
      border: 1px solid #f00;
      z-index: 20;
      bottom: 0;
      left: 35%;
      font-size: clamp(1px,3vw,60px);
      background: #000;
      border-radius: 999px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px 1px;
    }
    .compass {
      font-size: 2vw;
      color: #444;
      opacity: 1;
      box-shadow:none;
      border:none;width:90%;
      aspect-ratio:1/1;
      animation:none;
      display: flex;
      justify-content:center;
      align-items:center !important;
      background: none;
      height:100%;
      width:100%;
      position: relative;
      
    }
    .compass img {
      box-shadow:none !important;
      border:none !important;
      width:80% !important;
      aspect-ratio:1/1;
      animation:none !important;
      transition: transform 1s ease !important;
      top:10% !important;
      left:10% !important;
    }
    .compass img:hover {
      transform: rotate(180deg) !important;
      position: absolute;
      
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      height: 100%;
      width: 100%;
      z-index: 100000;
    }
    .space-nav {
      margin-top:30px;
      bottom: 10px;
      gap: 2px;
      background: linear-gradient(135deg,#333,#000);
      border: 0.5px solid #80f;
      border-radius: 9px;
      box-shadow: 0 0 clamp(4px,4vw,40px) #80f;
      z-index: 10;
      width: 30%;
      margin-left: 35%;
      max-width: 30vh;
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(2,1fr);
    }
    .nav-btn {
      font-family: "Uncial Antiqua", cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1vw,3vw,5vw);
      background: none;
      border: 1px solid #321;
      border-radius: 9px;
      color: #320;
      transition: all 1s ease;
      position: relative;
      overflow: hidden;
    }
    .nav-btn:hover { border-color: #fa0; color: #fa0; }
    .nav-center {
      border: clamp(1px,1vw,4px) solid #000;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: clamp(1px,0.5vw,8px);
      background: #588;
      transition: all 3s ease;
    }
    .nav-center:hover { transform: rotate(135deg); background: #000;
      display:none;
    }
    .nav-center button { background: #000; border: none; border-radius: 10px; }
    #nav-attack {
      width: 50%;
      aspect-ratio: 1/1;
      border-radius: 999px;
      border: 4px solid #fa0;
      left: 25%;
      background: none;
      border-left: none;
      border-bottom: none;
      border-right: none;
      z-index: 10;
      top: 10px;
      position: fixed;
      display: none;
      grid-template-columns: repeat(2,1fr);
      grid-template-rows: repeat(2,1fr);
      gap: 0;
      justify-items: center;
      align-items:center;
    }
    #nav-attack button {
      background: #000;
      border: clamp(1px,0.5vw,8px) solid #fa0;
      border-radius: 999px;
      box-shadow: 0 0 10px #555;
      height: 70%;
      width: 70%;
      color: #fa0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1px,3vw,4vw);
      font-family: "Uncial Antiqua", cursive;
    }
    .info-me {
      position: fixed;
      left: 1vw;
      top: 1vh;
      height: 35vw;
      width: 45vw;
      border: 1px solid #000;
      background: none;
      box-shadow: 0 0 10px #000;
      gap: 10px;
      display: grid;
      grid-template-rows: repeat(3,1fr);
    }
    .info-me img {
      height: 100%;
      position: absolute;
      top: 0;
      left: 10px;
      border: none;
      border-radius: 999px;
    }
    .info-me div {
      position: relative;
      width: 80%;
      border: clamp(1px,0.3vw,14px) solid #fa0;
      border-right: none;
      display: flex;
      box-shadow: 
        0 0 5px #fa0,
        0 0 10px #f80,
        0 0 5px inset #fa0;
      border-radius: clamp(1px,4vw,80px);
      display: flex;
      justify-content: left;
      background: #000;
      align-items: center;
    
      
    }
    .info-me div span, .info-me div h1 {
      white-space: nowrap;
      font-family: none;
      color: #f80;
      text-shadow: 0 0 10px #fa0;
      
      font-size: clamp(1px,4vw,60px);
      left: 18vw;
      position: absolute;
    }
    .info-me div h1 {
      left: auto;
      right: -3vw;
      font-size: clamp(1px,6vw,60px);
    }
    #map-enemie {
      height: 100%;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      box-shadow: 0 0 1px inset #aaa;
      background: #050505;
      display: none;
      justify-items: center;
      overflow-x: hidden;
    }
    .section-map-enemie-castle {
      border: none !important;
      border-left: 1px solid #ff3b1f !important;
      border-right: 1px solid #00d4ff !important;
      width: 90vw;
      margin-left: 0;
      margin-top: 58%;
      aspect-ratio: 1/1;
      display: grid;
      align-items: center;
      justify-items: center;
      border-radius: 999px;
    }
    .map-enemie-castle {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 999px;
      border: none;
      box-shadow: none;
      transition: all 2s ease;
    }
    .map-enemie-castle:hover { animation: rotate-rem 2s infinite; }
    .section-map-enemie-castle:hover { animation: rotate 2s infinite; }
    @keyframes rotate {
      0% {transform:rotate(0);}
      100% {transform:rotate(360deg);}
    }
    @keyframes rotate-rem {
      0% {transform:rotate(0);}
      100% {transform:rotate(-360deg);}
    }
    @keyframes shakeHard {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-5px, 8px) rotate(-2deg); }
      20% { transform: translate(8px, -6px) rotate(3deg); }
      30% { transform: translate(-12px, 4px) rotate(-5deg); }
      40% { transform: translate(10px, 10px) rotate(6deg); }
      50% { transform: translate(-15px, -12px) rotate(-8deg); }
      60% { transform: translate(14px, 5px) rotate(7deg); }
      70% { transform: translate(-8px, 15px) rotate(-4deg); }
      80% { transform: translate(6px, -10px) rotate(5deg); }
      90% { transform: translate(-3px, 3px) rotate(-2deg); }
    }
    .meno-in-map-enemie {
      position: fixed;
      bottom: 1vh;
      left: 25%;
      width: 50%;
      display: flex;
      height: 10vh;
      gap: 20px;
      border: none;
      border-bottom: 1px solid #fa0;
      border-radius: 999px;
      justify-content: center;
    }
    .btn-in-meno {
      font-family: "Londrina Shadow", cursive;
      background: none;
      color: #fa0;
      text-shadow: 0 0 10px #f00;
      height: 10vh;
      width: 10vh;
      aspect-ratio: 1/1;
      display: flex;
      justify-content: center;
      text-decoration: none;
      font-weight: 400;
      align-items: center;
      border: 1px solid #fa0;
      box-shadow: 0 0 5px #ffd700;
      font-size: clamp(1px,5vw,15px);
      border-radius: 999px;
      border-left: none;
      border-right: none;
      background: linear-gradient(135deg,#111,#000);
    }
    .section-cards {
      width: 70vw;
      aspect-ratio: 1/0.8;
      border: none;
      box-shadow: none;
      position: fixed;
      display: flex;
      gap: 1px;
      justify-content: center;
      align-items: center;
    }
    .card-me, .card-enemie {
      height: 100%;
      background: #000000;
      border-radius: 10px;
      border: 1px solid #ff3b1f;
      box-shadow: 0 0 25px rgba(255,59,31,0.6);
      width: 42%;
      position: relative;
      display: grid;
      align-items: center;
      justify-items: center;
    }
    .card-enemie {
      border: 1px solid #00d4ff;
      box-shadow: 0 0 25px rgba(0,212,255,0.5);
    }
    .card-me img, .card-enemie img {
      position: absolute;
      width: 90%;
      animation: none;
      border: none;
      box-shadow: none;
      border-radius: 2px;
    }
    .card-me h1, .card-enemie h1 {
      font-family: none;
      height: 20%;
      width: 100%;
      border: none;
      color: #fa0;
      position: absolute;
      bottom: 0;
      font-size: clamp(1px,4vw,8vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emoji-katana {
      width: 16%;
      font-size: clamp(4px,8vw,10vw);
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 10px #ffaa12;
      height: 100%;
    }
    #section-info-enemie {
      height: 100%;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
      z-index: 100;
      display: none;
      overflow-y: auto;
      justify-items: center;
    }
    .section-info-enemie-img {
      width: 60%;
      aspect-ratio: 1/1;
      margin-top: 5vh;
    }
    #section-info-enemie title {
      height: 5vh;
      display: grid;
      align-items: center;
      text-align: center;
      justify-items: center;
      margin-top: 1vh;
      color: #f80;
      font-size: clamp(1px,6vw,30px);
      background: linear-gradient(90deg,#ffd700,#f50,#ffd700);
      animation: bg 4s infinite;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      background-size: 200% 100%;
    }
    @keyframes bg {
      0% {background-position: 0% 50%}
      100% {background-position: 200% 50%}
    }
    .info {
      border: 0.5px solid #333;
      background: #555;
      margin-top: 1vh;
      display: grid;
      justify-items: center;
      grid-template-columns: repeat(1,1fr);
      grid-template-rows: repeat(3,1fr);
      gap: 1px;
      height: 20vh;
      width: 90vw;
      box-shadow: 0 2px 4px #555;
    }
    .info output {
      background: #000;
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 0;
      display: grid;
      align-items: center;
    }
    .info output h1, .info output h2 {
      background: linear-gradient(90deg,#333,#fff,#555);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      font-size: clamp(1px,4vw,30px);
      position: absolute;
      left: 20px;
    }
    .info output h2 {
      color: #888;
      right: 20px;
      left: auto;
      text-shadow: none;
      font-family: 'Risque', cursive;
    }
    .info output img {
      position: absolute;
      height: 90%;
      left: 20px;
    }
    #show-castle {
      position: fixed;
      right: 1vw;
      bottom: 20%;
      width: 10vw;
      height: 10vw;
      border-radius: 10px;
      border: 1px solid #fa0;
      padding: 0 0;
    }
    #img-show-castle {
      height: 100% !important;
      width: 100% !important;
      border-radius: 10px;
    }
    .btn-close {
      position: absolute;
      top: 1vh;
      left: 1vw;
      width: 10vw;
      aspect-ratio: 1/1;
      background: #000;
      border: 1px solid #fff;
      border-radius: 999px;
      color: #fff;
      font-size: clamp(2px,3vw,30px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-result-war {
      height: 100%;
      width: 100%;
      position: fixed;
      background: #000;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .section-result-war {
      background: #c0c0c0;
      box-shadow: 0 0 10px #f70;
      border: 1px solid #fa0;
      height: 70%;
      width:90vw;
      max-width: 50rem;
      border-radius: 10px;
      display: grid;
      grid-template-rows: 3fr 1fr 1fr 3fr;
      gap: 1px;
    }
    .section-result-war div, .section-result-war output{
      background: #000000;
      border-radius: 10px;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 0;
      justify-content: center;
      align-items: center;
    }
    .section-result-war output {
      justify-content: flex-start;
    }
    .section-result-war div h1, .section-result-war output h2 {
      font-size: clamp(4px,13vw,100px);
      text-shadow: none;
      flex-shrink: 0;
      height: auto;
      width: auto;
      display: grid;
      text-align: center;
      justify-items: center;
      border: none;
      margin-left: 0;
      text-shadow: 0 0 10px #ffd700;
      opacity: 1;
    }
    .section-result-war output h2, .section-result-war h3 {
      font-size: clamp(4px,5vw,60px);
      color: #000;
      -webkit-text-stroke: clamp(0.4px,0.1vw,8px) #f90;
      width: 40%;
      height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-shadow: 0 0 10px #fa0;
      border: 1px solid #fa0;
    }
    .section-result-war h3 {
      color: #fa0;
      -webkit-text-stroke: clamp(0.4px,0.1vw,8px) #f70;
      font-size: clamp(4px,5vw,24px);
      width: 80%;
      height: 30%;
      box-shadow: 
        0 0 2px #fa0,
        0 0 6px #f50,
        0 0 4px #fc0,
        0 0 6px inset #f50
        ;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>
  <output class="info-me">
    <div>
      <img src='images/cup.jpg'>
      <span id='cup-me'></span>
      <h1>✦</h1>
    </div>
    <div style='width:98%;border:clamp(1px,0.3vw,14px) solid #80f;box-shadow:0 0 4px #80f,0 0 6px #00f,0 0 8px #80f,0 0 8px inset #50f;'>
      <img src='images/sword.jpg'>
      <span id='power-me' style='color:#50f;text-shadow:0 0 15px #90f'></span>
      <h1 style='color:#50f;text-shadow:0 0 10px #80f'>✦</h1>
    </div>
    <div>
      <img src='images/star.jpg'>
      <span id='level-me'></span>
      <h1>✦</h1>
    </div>
  </output>
  <nav id="nav-attack">
    <button id="btn-attack">Atack</button>
    <button id="btn-info">Info</button>
  </nav>
  <section id="fatherMap">
    <section></section>
    <div>
    <img src="images/enemie5.jpg" class="castle223" data-info='{"power":95000,"level":10,"name":"castle1","gold":1000,"wood":3500,"weath":3500,"cavalry":200,"chariot":100,"archer":800,"infantry":900,"imgForces":"images/forces-enemie-5.jpg","cupReward":6}'>
      <h1 style='color:#fda;border:1px solid #fda'>5</h1>
    </div>
    <section></section>
    <div>
    <img src="images/enemie10.jpg" class="castle223" data-info='{"power":205000,"level":15,"name":"castle2","gold":1500,"wood":15000,"weath":15000,"cavalry":400,"chariot":200,"archer":1600,"infantry":1800,"imgForces":"images/forces-enemie-10.jpg","cupReward":12}'>
      <h1 style='color:#fd8;border:1px solid #fd8'>10</h1>
    </div>
    <article class='compass'>
      <img src='images/direction.jpg'>
    </article>
    <div>
    <img src="images/enemie15.jpg" class="castle223" data-info='{"power":310000,"level":20,"name":"castle3","gold":3500,"wood":25000,"weath":25000,"cavalry":800,"chariot":400,"archer":3200,"infantry":3600,"imgForces":"images/forces-enemie-15.jpg","cupReward":18}'>
      <h1 style='color:#fc4;border:1px solid #fc4'>15</h1>
    </div>
    <section></section>
      
    <div>
    <img src="images/enemie20.jpg" class="castle223" data-info='{"power":815000,"level":25,"name":"castle4","gold":7000,"wood":40000,"weath":40000,"cavalry":1600,"chariot":800,"archer":6400,"infantry":7200,"imgForces":"images/forces-enemie-20.jpg","cupReward":24}'>
      <h1 style='color:#fa0;border:1px solid #fa0'>20</h1>
    </div>
    <section></section>
    <audio src="Sounds/War.mp3" id="music" loop></audio>
    <audio id="soundClick" src="Sounds/click.mp3"></audio>
  </section>

  <nav class="space-nav">
    <button class="nav-btn" id="playMusic">Music</button>
    <button class="nav-btn">Attack</button>
    <button class="nav-btn" id="shop">Shop</button>
    <button class="nav-btn" onclick='history.back()'>Back</button>
  </nav>
  <section id="map-enemie">
    <button class='btn-close'>×</button>
    <section class="section-cards">
      <div class="card-me">
        <img src='images/forces-Me.jpg' id='img-forces-me'>

      </div>

    <section class="section-map-enemie-castle">
      <img id="castle-enemie" src="" class="map-enemie-castle">

    <nav class="meno-in-map-enemie">

      <a class="btn-in-meno" onclick='history.back()'>Running</a>

    <button id="show-castle">
      <img src='' id='img-show-castle'>
    </button>
  </section>
  <section id='section-info-enemie'>
    <button class='btn-close'>×</button>
    <img src='images/spy.jpg' class='section-info-enemie-img'>
    <title>✦Castle✦</title>
    <section class='info'>
      <output><h1>power :</h1><h2 id='enemie-power'></h2></output>
      <output><h1>level:</h1><h2 id='enemie-level'></h2></output>
      <output><h1>castle name :</h1><h2 id='enemie-name'></h2></output>
    </section>
    <title>✦Treasury✦</title>
    <section class='info top'>
      <output><h1>gold :</h1><h2 id='enemie-gold'></h2></output>
      <output><h1>wood :</h1><h2 id='enemie-wood'></h2></output>
      <output><h1>weath :</h1><h2 id='enemie-weath'></h2></output>
    </section>
    <title>✦Army✦</title>

      <output><img src='images/cavalry.jpg'><h2 id='enemie-cavalry'></h2></output>
      <output><img src='images/chariot.jpg'><h2 id='enemie-chariot'></h2></output>
      <output><img src='images/archer.jpg'><h2 id='enemie-archer'></h2></output>
      <output><img src='images/infantry.jpg'><h2 id='enemie-infantry'></h2></output>
      <output><img src='images/forces-Me.jpg'><h2 id='enemie-forces'></h2></output>
    </section>
  </section>
  <!-- ==================== Result War ==================== -->
  <section class='page-result-war' id='page-result-war'>
    <button class='btn-close'>×</button>
    <section class='section-result-war' id='section-result-war'>
      <div>
        <h1 id='star-1'> </h1>
        <h1 style='margin-top:-10px' id='star-2'> </h1>
        <h1 id='star-3'> </h1>
      </div>
      <output>
        <h2 id='reward-gold'>🌾:...</h2>
        <h2 id='reward-wood'>🪵:...</h2>
        <h2 id='reward-weath'>🪙:...</h2>
        <h2 id='reward-cup'>🏆: +15</h2>
      </output>
      <output>
        <h2 id='forces-me-2'>....</h2>
        <h2 id='forces-enemie-2'>....</h2>
        <h2 id='remainder-forces-me'>....</h2>
        <h2 id='remainder-forces-enemie'>....</h2>
      </output>
      <div>
        <h3 id='message-result-war'>Loading...</h3>
      </div>
      <audio src='Sounds/result-music.mp3' id='result-music'></audio>
    </section>
  </section>
  <script>
    /* ==================== JS ==================== */
    let starBg = document.getElementById("starCanvas");
    let starPn = starBg.getContext("2d");
    starBg.width = window.innerWidth;
    starBg.height = window.innerHeight;
    let atoms = [];
    class creatAtom {
      constructor() {
        this.x = Math.random() * starBg.width;
        this.y = Math.random() * starBg.height;
        this.moveX = (Math.random() - 0.5) * 0.3;
        this.moveY = (Math.random() - 0.5) * 0.3;
        this.size = Math.random() * 2.5;
        this.opacity = Math.random() + 0.05;
        this.randomColor = Math.floor(Math.random()*2);
      }
      update() {
        this.x += this.moveX;
        this.y += this.moveY;
        if (this.x > starBg.width || this.x < 0) this.moveX *= -1;
        if (this.y > starBg.height || this.y < 0) this.moveY *= -1;
      }
      draw() {
        starPn.beginPath();
        starPn.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        let listColor = [`rgba(255,180,0,${this.opacity})`,`rgba(80,80,80,${this.opacity})`];
        starPn.fillStyle = listColor[this.randomColor];
        starPn.fill();
      }
    }
    for (let i = 0; i < 200; i++) atoms.push(new creatAtom());
    function updateStars() {
      starPn.clearRect(0, 0, starBg.width, starBg.height);
      atoms.forEach(A => { A.update(); A.draw(); });
      requestAnimationFrame(updateStars);
    }
    updateStars();
    let castles = document.querySelectorAll(".castle223");
    window.addEventListener("resize", () => {
      starBg.width = window.innerWidth;
      starBg.height = window.innerHeight;
      atoms = [];
      for (let i = 0; i < 100; i++) {
        let atom = new creatAtom();
        atom.size *= 1.2;
        atoms.push(atom);
      }
    });

    let statusMusic = false;
    let music = document.getElementById("music");
    let btnMusic = document.getElementById("playMusic");
    btnMusic.addEventListener("click", () => {
      if (statusMusic === false) { music.play(); statusMusic = true; }
      else { music.pause(); statusMusic = false; }
    });
    document.addEventListener("click", () => {
      let soundClick = document.getElementById("soundClick");
      soundClick.play();
    });

    let btnShop = document.getElementById("shop");
    btnShop.addEventListener("click", () => { window.location.href = "shop.html"; });

    let castleEnemie = document.getElementById("castle-enemie");
    let allImages = document.querySelectorAll("img");
    let objectEnemieInfo = {};
    allImages.forEach(EF => {
      EF.addEventListener("click", () => { castleEnemie.src = EF.src; });
    });
    let navAttack = document.getElementById("nav-attack");
    let imgCastleEnemie = '';
    castles.forEach(IMG => {
      IMG.addEventListener("click", () => {
        objectEnemieInfo = JSON.parse(IMG.dataset.info);
        console.log(objectEnemieInfo);
        imgCastleEnemie = IMG.src;
        document.getElementById('img-show-castle').src = imgCastleEnemie;
        navAttack.style.display = "grid";
        setTimeout(() => { navAttack.style.display = "none"; }, 5000);
      });
    });
    const btnShowCastle = document.getElementById("show-castle");
    btnShowCastle.addEventListener("click", () => { castleEnemie.src = imgCastleEnemie; });

    const btnAttack = document.getElementById("btn-attack");
    let mapEnemie = document.getElementById("map-enemie");
    btnAttack.addEventListener("click", () => {
      mapEnemie.style.display = "grid";
      enemie_information();
      document.getElementById('img-forces-enemie').src = objectEnemieInfo.imgForces;
    });

    const btnInfo = document.getElementById("btn-info");
    const sectionInfoEnemie = document.getElementById('section-info-enemie');
    btnInfo.addEventListener('click', () => {
      sectionInfoEnemie.style.display = 'grid';
      enemie_information();
      
    });
    
    /*==================== ENEMIE INFORMATION ==================== */
    let forcesEnemie = 0;
    function enemie_forces(){
      if(!objectEnemieInfo){
        return
      }else{
        forcesEnemie = Number(objectEnemieInfo.cavalry) + Number(objectEnemieInfo.chariot) + Number(objectEnemieInfo.archer) + Number(objectEnemieInfo.infantry);
        document.getElementById('enemie-forces').textContent = forcesEnemie;
        document.getElementById('forces-enemie').textContent = forcesEnemie;
      }
    }
    function enemie_information() {
      const enemyFields = {
        power: 'enemie-power',
        level: 'enemie-level',
        name: 'enemie-name',
        gold: 'enemie-gold',
        wood: 'enemie-wood',
        weath: 'enemie-weath',
        cavalry: 'enemie-cavalry',
        chariot: 'enemie-chariot',
        archer: 'enemie-archer',
        infantry: 'enemie-infantry'
      };

      for ([key, id] of Object.entries(enemyFields)) {
        document.getElementById(id).textContent = objectEnemieInfo[key];
      }
      enemie_forces();
    }
    
    let tagForcesMe = document.getElementById('forces-me');
    
    let powerMe = 0;
    let levelMe = 0;
    let forcesMe = 0;
    let cups = 0;
    function getInfoMe(){
      forcesMe = parseInt(localStorage.getItem('totalForces')) || 0;
      powerMe = shortPower(parseInt(localStorage.getItem('power')))||0;
      levelMe = parseInt(localStorage.getItem('castleLevel'))||1;
      cups = parseInt(localStorage.getItem('cups'))||1;
    }
    getInfoMe();
    
    
    function giveInfoMe(){
    document.getElementById('cup-me').textContent =  cups;
    document.getElementById('power-me').textContent =  powerMe;
    document.getElementById('level-me').textContent = levelMe;
    tagForcesMe.textContent = forcesMe;
      }
    giveInfoMe();
    function shortPower(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      else if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      else return num;
    }
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    /*==================== RESULT WAR ===================*/
    let resources = JSON.parse(localStorage.getItem('resources'))||{gold:0,wood:0,weath:0};

    let finalBtnAttack = document.getElementById('final-btn-attack');
    let pageResultWar = document.getElementById('page-result-war');


    finalBtnAttack.addEventListener('click',()=>{
      document.getElementById('result-music').play();
      let research = JSON.parse(localStorage.getItem('research')) || {
        forces:0,
        resources:0,
        castle:0,
      };
      let forces = JSON.parse(localStorage.getItem('forces'))|| { infantry: 0, cavalry: 0, archer: 0, chariot: 0 };
      let remainderForcesMe = forcesMe - (forcesEnemie * (1-(research.forces/10)));
      if(remainderForcesMe<0){
        remainderForcesMe = 0;
      }

      let remainderForcesEnemie = forcesEnemie - forcesMe;
      let theDeadMe = forcesMe>0?((forcesMe - (remainderForcesMe))/forcesMe)*100:100;
      let lostRatio = remainderForcesMe / forcesMe;
      forces.infantry = Math.floor(forces.infantry * lostRatio);
      forces.cavalry = Math.floor(forces.cavalry * lostRatio);
      forces.archer = Math.floor(forces.archer * lostRatio);
      forces.chariot = Math.floor(forces.chariot * lostRatio);
      if(remainderForcesEnemie<0){
        remainderForcesEnemie = 0;
      }
      let rewardCup = 0;
      let resultWar = '';
      if(theDeadMe <= 80){
        document.getElementById('star-1').textContent = '⭐';
        rewardCup = Math.ceil(objectEnemieInfo.cupReward/3);
        resultWar = 'good';
      } else {
        document.getElementById('star-1').textContent = '💀';
      }
      if(theDeadMe <= 40){
        document.getElementById('star-2').textContent = '⭐';
        rewardCup = Math.ceil(2/objectEnemieInfo.cupReward);
        resultWar = 'very good';
      } else {
        document.getElementById('star-2').textContent = '💀';
      }
      if(theDeadMe<=20){
        document.getElementById('star-3').textContent = '⭐';
        rewardCup = objectEnemieInfo.cupReward;
        resultWar = 'Excellent';
      } else {
        document.getElementById('star-3').textContent = '💀';
      }

      document.getElementById('forces-me-2').textContent = forcesMe;
      document.getElementById('forces-enemie-2').textContent = forcesEnemie;
      document.getElementById('remainder-forces-me').textContent = remainderForcesMe;
      document.getElementById('remainder-forces-enemie').textContent = remainderForcesEnemie;
      let sectionResultWar = document.getElementById('section-result-war');
      let messageResultWar = document.getElementById('message-result-war');
      if(remainderForcesMe>remainderForcesEnemie){
        pageResultWar.style.display = 'grid';
        document.getElementById('reward-gold').textContent = '🪙: +'+(objectEnemieInfo.gold);
        resources.gold += objectEnemieInfo.gold;
        document.getElementById('reward-wood').textContent = '🪵: +'+ objectEnemieInfo.wood;
        resources.wood += objectEnemieInfo.wood;
        document.getElementById('reward-weath').textContent = '🌾: +'+ objectEnemieInfo.weath;
        resources.weath += objectEnemieInfo.weath;
        document.getElementById('reward-cup').textContent = '🏆: +'+ rewardCup;
        messageResultWar.innerHTML = '⚔You won⚔<br>'+  resultWar;
      } else if(remainderForcesMe<remainderForcesEnemie){
        pageResultWar.style.display = 'grid';
        sectionResultWar.style.border = '1px solid #f40';
        sectionResultWar.style.boxShadow = '0 0 10px #f30';
        messageResultWar.style.color = '#f00';
        messageResultWar.style.textShadow = '0 0 10px #f00';
        document.getElementById('reward-gold').textContent = '🪙: +'+ 0;
        document.getElementById('reward-wood').textContent = '🪵: +' + 0;
        document.getElementById('reward-weath').textContent = '🌾: +'+ 0;
        document.getElementById('reward-cup').textContent = '🏆: -2';
        rewardCup -= 2;
        document.querySelectorAll('[id^="star-"]').forEach(star=>{
          star.style.color = '#f00';
        });
        messageResultWar.textContent = 'you lose';
      }
      cups += rewardCup;
      if(cups<0){
        cups = 0;
      }
      
      localStorage.setItem('forces', JSON.stringify(forces));
      localStorage.setItem('totalForces',remainderForcesMe);
      localStorage.setItem('cups',cups);
      localStorage.setItem('resources',JSON.stringify(resources));
      
    });
    document.querySelectorAll('.btn-close').forEach(page => {
      page.addEventListener('click', () => {
        sectionInfoEnemie.style.display = 'none';
        pageResultWar.style.display = 'none';
        mapEnemie.style.display = 'none';
      });
    });
    function callFunction(){
      getInfoMe();
      giveInfoMe();
    }
    setInterval(callFunction,2000);
  </script>
</body>
  </html>
