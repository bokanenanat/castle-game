<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0a0f;
      min-height: 100dvh;
      display: grid;
      justify-items: center;
      align-items: center;
    }
    
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    
    .fog {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(100, 80, 40, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(100, 80, 40, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(100, 80, 40, 0.1) 0%, transparent 40%);
      filter: blur(50px);
      animation: fogDrift 20s ease-in-out infinite;
    }
    
    @keyframes fogDrift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(2%, 2%); }
    }
    .container-gallery {
      background: none;
      width: 98%;
      aspect-ratio: 1/1;
      z-index: 50;
      gap: 3px;
      border-radius: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .element {
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      border: 1px solid #300030;
      box-shadow: 0 0 2px #000;
      border: 1px solid #750;
      border-radius: 10px;
      }
    .back-btn {
      border-radius: 10px;
      background: #000;
      color: #f00;
      display: grid;
      align-items: center;
      justify-items: center;
      height: 3rem;
      width: 6rem;
      box-shadow: 0 0 15px #f00;
      text-decoration: none;
      border: 1px solid #f00;
      font-weight: 500;
      position: fixed;
      bottom: 1vh;
    }
    .message-success {
      width: 60vw;
      height: 10vh;
      background: #efe;
      color: #595;
      text-shadow: 0 0 10px #383;
      border-radius: 10px;
      border: 1px solid #4f4;
      box-shadow: 0 0 10px #0f0;
      display: none;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 1vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="fog"></div>
  
  <section class='container-gallery'>
    <img class='element' onclick='changProfile(this)' src='prof/1.jpg'>
    <img class='element' onclick='changProfile(this)' src='prof/2.jpg'>
    <img class='element' onclick='changProfile(this)' src='prof/3.png'>
    <img class='element' onclick='changProfile(this)' src='https://i.imgur.com/X9hDH1N.png'>
    <img class='element' onclick='changProfile(this)' src='https://i.imgur.com/oox2OkC.png'>
    <img class='element' onclick='changProfile(this)' src='https://i.imgur.com/PKfS1Pz.png'>
    <img class='element' onclick='changProfile(this)' src='prof/7.png'>
    <img class='element' onclick='changProfile(this)' src='prof/8.png'>
    <img class='element' onclick='changProfile(this)' src='prof/9.png'>
  </section>
  <a class='back-btn' href='Game.html'>back</a>
  <section id='message-success' class='message-success'> Changed&#x2713;</section>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let particles = [];
    
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.moveX = (Math.random() - 0.5) * 0.5;
        this.moveY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.size = Math.random() * 3 + 1;
        this.color = `rgba(255, 150, 0, ${this.opacity})`;
      }
      
      update() {
        this.x += this.moveX;
        this.y += this.moveY;
        
        if (this.x > canvas.width || this.x < 0) {
          this.moveX *= -1;
        }
        if (this.y > canvas.height || this.y < 0) {
          this.moveY *= -1;
        }
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
    
    for (let i = 0; i < 90; i++) {
      particles.push(new Particle());
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    function changProfile(img) {
    localStorage.setItem('selectedProfile',img.src);
      let toggleMessage = document.getElementById('message-success');
      function message() {
        toggleMessage.style.display = 'flex';
      }
      message();
      setTimeout(()=>{toggleMessage.style.display='none'},3500);
    }
  </script>
</body>
  </html>
