<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
    }
    :root {
      --gold: #ff9900;
      --gray: #808080;
      --blue: #2299ef;
      --black:#01010f;
      --green:#1eff55;
    }
    body {
      background: var(--black);
      overflow-x: hidden;
      min-height: 100dvh;
      display: grid;
      justify-items: center;
    }
    .father {
      margin-top: 10vh;
      height: 40vh;
      width: 84vw;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      align-items: center;
    }
    .main-section {
      border: 0.5px solid var(--gold);
      box-shadow: 0 0 8px var(--gold);
      background: #00000070;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .plans {
      margin-top: 8vh;
      margin-bottom: 8vh;
      flex-shrink: 0;
      height: 20vh;
      width: 28vw;
      margin-left: 0;
      display: grid;
      justify-items: center;
      background: #000;
      border: 1px solid var(--gold);
    }
    img {
      pointer-events: none;
    }
    .plans img {
      width: 28vw;
      height: 14vh;
      box-shadow: 0 0 10px var(--gold);
      border: none;
      border-bottom: 1px solid var(--gold);
    }
    .plans h1 {
      color: var(--gold);
      height: 6vh;
      width: 28vw;
      font-size: clamp(1px, 3vw,6vw);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 0;
      line-height: 1.1;
      border: none;
    }
    .canvas {
      height: 100%;
      width: 100%;
      position: fixed;
      top:0;
      left:0;
      z-index: 10;
      user-select: none;
      pointer-events: none;
    }
    /* ==================== ERROR BOX ==================== */
.error-box-gold {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(160deg, #1a0000, #0d0000, #200000);
  border: 2px solid #f00;
  border-radius: 20px;
  padding: 30px 50px;
  color: #f00;
  font-family: 'Rye', cursive;
  font-size: clamp(16px, 5vw, 28px);
  text-shadow: 0 0 15px #f00;
  box-shadow:
    0 0 20px #f00,
    0 0 40px #f00,
    0 0 60px #800,
    inset 0 0 30px rgba(255, 0, 0, 0.15);
  z-index: 99999;
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  text-align: center;
  pointer-events: none;
  letter-spacing: 2px;
}

.error-box-gold.show {
  transform: translate(-50%, -50%) scale(1);
}

.error-box-gold::before {
  content: '💀';
  display: block;
  font-size: 3em;
  margin-bottom: 15px;
  animation: errorShake 0.6s infinite;
  filter: drop-shadow(0 0 15px #f00);
}

@keyframes errorShake {
  0%, 100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(-8px) rotate(-5deg); }
  75% { transform: translateX(8px) rotate(5deg); }
}

/* ==================== SUCCESS BOX ==================== */
.success-box-gold {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(160deg, #001a00, #000d00, #002200);
  border: 2px solid #0f0;
  border-radius: 20px;
  padding: 30px 50px;
  color: #ffd700;
  font-family: 'Rye', cursive;
  font-size: clamp(16px, 5vw, 28px);
  text-shadow:
    0 0 10px #ffd700,
    0 0 20px #ffa500,
    0 0 30px #0f0;
  box-shadow:
    0 0 20px #0f0,
    0 0 40px #ffd700,
    0 0 60px #ffa500,
    inset 0 0 30px rgba(0, 255, 0, 0.15);
  z-index: 99999;
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  text-align: center;
  pointer-events: none;
  letter-spacing: 2px;
}

.success-box-gold.show {
  transform: translate(-50%, -50%) scale(1);
}

.success-box-gold::before {
  content: '🏆';
  display: block;
  font-size: 3em;
  margin-bottom: 15px;
  animation: successBounce 0.6s infinite alternate;
  filter: drop-shadow(0 0 15px #ffd700);
}

@keyframes successBounce {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-15px) scale(1.1); }
                                    }
    .forces-scroller {
      margin-top: 5vh;
      margin-left: 0;
      width: 90vw;
      height: 18vh;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 1rem 1rem;
      z-index: 30;
      scroll-snap-type: x mandatory;
    }

.forces-scroller::-webkit-scrollbar {
  display: none;
}

.force-card, .res-card {
  flex-shrink: 0;
  width: 20vw;
  min-width: 100px;
  height: 98%;
  background: #000;
  border: 1px solid var(--gold);
  box-shadow: 0 0 8px var(--gold);
  border-radius: 10px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.force-card:hover {
  box-shadow: 0 0 20px var(--gold);
  transform: translateY(-3px);
}

.force-card img, .res-card img {
  width: 100%;
  height: 60%;
  object-fit: contain;
  border-bottom: 1px solid var(--gold);
}

.force-card h1, .res-card h1 {
  color: var(--gold);
  font-size: clamp(8px, 3vw, 14px);
  text-align: center;
  line-height: 1.2;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  margin: 0;
    }
    .force-card h2, .res-card h2 {
      color: #eee;
      top: 0;
      left: 1px;
      font-size: clamp(8px, 3vw, 14px);
      z-index: 10000;
      position: absolute;
    }
  </style>
</head>
  <body>

  <script>
    let bg = document.getElementById('canvas');
    let pn = bg.getContext('2d');
    bg.width = window.innerWidth;
    bg.height = window.innerHeight;
    let atoms = [];
    class creatAtom {
      constructor() {
        this.x = Math.random()*bg.width;
        this.y = Math.random()*bg.height;
        this.moveX = (Math.random()-0.5)*0.5;
        this.moveY = (Math.random()-0.5)*0.5;
        this.size = Math.random()*3.5;
        this.opacity = Math.random();
      }
      update() {
        this.x += this.moveX;
        this.y += this.moveY;
        if(this.x > bg.width || this.x< 0){
          this.moveX *= -1;
        }
        if(this.y > bg.height || this.y < 0) {
          this.moveY *= -1;
        }
    }
        draw() {
          pn.beginPath();
          pn.arc(this.x,this.y,this.size,0,Math.PI*2);
          pn.fillStyle = `rgba(255,100,55,${this.opacity})`;
          pn.fill();
      }
    }
    for(let i = 0;i < 30; i++){
      atoms.push(new creatAtom());
    }
    function updateAtom(){
    pn.clearRect(0,0,bg.width,bg.height);
    atoms.forEach(A=>{
        A.update();
        A.draw();
      });
      for(let i= 0; i< atoms.length; i++){
        for(let j= i; j< atoms.length;j++){
          let a = atoms[i];
          let b = atoms[j];
          const distance =  Math.floor(Math.sqrt((a.x-b.x)**2+(b.y-a.y)**2));
        if(distance<150){
        pn.beginPath();
        pn.moveTo(a.x,a.y);
        pn.lineTo(b.x,b.y);
        pn.strokeStyle = '#ffaa33';
          pn.lineWidth= 0.5;
        pn.stroke();
            }
          }
        }
        requestAnimationFrame(updateAtom);
    }
    updateAtom();
    function openPyment(){
      document.querySelectorAll('.plans').forEach(P=>{
        P.addEventListener('click',()=>{window.location.href='pyment.html'});
      });
    } openPyment();
    /* ==================== SHOW ERROR ==================== */
function showError(message) {
  // حذف قبلی
  let old = document.querySelector('.error-box-gold');
  if (old) old.remove();

  // ساخت جدید
  let box = document.createElement('div');
  box.classList.add('error-box-gold');
  box.textContent = message;
  document.body.appendChild(box);

  // نمایش
  setTimeout(() => box.classList.add('show'), 10);

  // حذف
  setTimeout(() => {
    box.classList.remove('show');
    setTimeout(() => box.remove(), 500);
  }, 3000);
}

/* ==================== SHOW SUCCESS ==================== */
function showSuccess(message) {
  let old = document.querySelector('.success-box-gold');
  if (old) old.remove();

  let box = document.createElement('div');
  box.classList.add('success-box-gold');
  box.textContent = message;
  document.body.appendChild(box);

  setTimeout(() => box.classList.add('show'), 10);

  setTimeout(() => {
    box.classList.remove('show');
    setTimeout(() => box.remove(), 500);
  }, 3000);
             }
    
    let resources = JSON.parse(localStorage.getItem('resources')) || {
      gold: 0,
      wood: 0,
      weath: 0
    };
    document.querySelectorAll('.force-card').forEach(card => {
  card.addEventListener('click', () => {
    let forceType = card.dataset.force;
    let cost = parseInt(card.dataset.cost);

    if (resources.gold >= cost) {
      resources.gold -= cost;
      localStorage.setItem('resources', JSON.stringify(resources));
      
      let forces = JSON.parse(localStorage.getItem('forces')) || {
        infantry: 0,
        cavalry: 0,
        archer: 0,
        chariot: 0
      };
      
      forces[forceType] += 250;
      localStorage.setItem('forces', JSON.stringify(forces));
      
      showSuccess('⚡'+forceType+'⚡');
    } else {
      showError('your coins not enough');
    }
  });
});
    document.querySelectorAll('.res-card').forEach(card=>{
      card.addEventListener('click',()=>{
        const resType = card.dataset.type;
        const cost = Number(card.dataset.cost);
        const value= cost*10;
        if(resources.gold>=cost) {
          resources.gold -= cost;
          resources[resType] += value;
          localStorage.setItem('resources', JSON.stringify(resources));
          showSuccess('⚡'+resType+'⚡');
        } else {
          showError('your coins not enough !');
        }
      });
    });
  </script>
